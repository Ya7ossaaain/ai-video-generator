name: Render LEMMiNO Animation with AGY Reviewer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Blender
      uses: actions/cache@v4
      with:
        path: ~/blender
        key: blender-4.2.0-linux-x64

    - name: Install System Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq wget xz-utils

    - name: Install Blender Portable
      run: |
        if [ ! -d "$HOME/blender" ]; then
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xf blender-4.2.0-linux-x64.tar.xz
          mv blender-4.2.0-linux-x64 "$HOME/blender"
          rm blender-4.2.0-linux-x64.tar.xz
        fi
        echo "$HOME/blender" >> "$GITHUB_PATH"

    - name: Install Python Dependencies
      run: |
        pip install --no-cache-dir huggingface_hub trimesh

    - name: Setup & Authenticate Antigravity (agy CLI)
      env:
        AGY_CREDENTIALS: ${{ secrets.AGY_CREDENTIALS }}
      run: |
        if ! command -v agy &> /dev/null; then
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
        fi

        mkdir -p ~/.config/antigravity ~/.config/agy ~/.gemini
        if [ -n "$AGY_CREDENTIALS" ]; then
          if echo "$AGY_CREDENTIALS" | grep -q "^{"; then
            echo "$AGY_CREDENTIALS" > ~/.config/antigravity/credentials.json
            echo "$AGY_CREDENTIALS" > ~/.config/agy/credentials.json
          elif echo "$AGY_CREDENTIALS" | base64 -d >/dev/null 2>&1; then
            echo "$AGY_CREDENTIALS" | base64 -d > ~/.config/antigravity/credentials.json
            echo "$AGY_CREDENTIALS" | base64 -d > ~/.config/agy/credentials.json
          else
            echo "$AGY_CREDENTIALS" > ~/.config/antigravity/token
            echo "$AGY_CREDENTIALS" > ~/.config/agy/token
          fi
        fi

    - name: Execute Full Autonomous Pipeline
      env:
        AGY_CREDENTIALS: ${{ secrets.AGY_CREDENTIALS }}
      run: |
        python3 generate_scene.py

    - name: Upload Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lemmino-video
        path: lemmino_jump.mp4
