name: Build Documentary

on:
  workflow_dispatch:
    inputs:
      video_topic:
        description: 'اسم موضوع الفيلم الوثائقي (القضية)'
        required: true
        default: 'لغز اختفاء طائرة دي بي كوبر'

jobs:
  build-documentary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow arabic-reshaper python-bidi yt-dlp google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib google-antigravity

      - name: Install Antigravity CLI
        run: |
          curl -fsSL --compressed https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Antigravity Full OAuth2
        env:
          # سحب الـ JSON من السر الذي أنشأته أنت مسبقاً
          OAUTH_JSON: ${{ secrets.AGY_CREDENTIALS }}
        run: |
          mkdir -p ~/.gemini/antigravity-cli/
          # استخدام printf لكتابة الـ JSON في المسار الرسمي لـ Antigravity
          printf "%s" "$OAUTH_JSON" > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token

      - name: Run Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TOPIC: ${{ github.event.inputs.video_topic }}
        run: python pipeline.py

      - name: Commit Memory and Code Updates
        run: |
          git config --global user.name "Hybrid-AI-Director"
          git config --global user.email "actions@github.com"
          git add director_memory.md pipeline.py
          git commit -m "🧠 تحديث الذاكرة التراكمية والكود المصدري" || echo "لا توجد تحديثات لرفعها"
          git push

      - name: Upload Master Vault Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Master-Documentary-Vault
          path: output_build/*.mp4
          retention-days: 3

