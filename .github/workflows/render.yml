name: 🎬 The Mastermind - Hybrid Engine

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيلم الوثائقي (اكتب القضية أو اللغز هنا)'
        required: true
        default: 'لغز اختفاء طائرة دي بي كوبر'

jobs:
  build-documentary:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: 🐍 تجهيز بيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ تثبيت محرك المونتاج (FFmpeg) والخطوط
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-dejavu

      - name: 📦 تثبيت مكتبات الذكاء الاصطناعي والميديا
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow arabic-reshaper python-bidi yt-dlp
          pip install google-genai
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: 🚀 تثبيت وكيل Google Antigravity (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🔐 زرع مفاتيح تسجيل الدخول (Pro Authentication)
        run: |
          # إنشاء المجلد المخفي الذي تبحث فيه الأداة عن الأسرار
          mkdir -p ~/.gemini/antigravity-cli/
          # زرع التوكن السري الذي استخرجته من Termux
          echo '${{ secrets.AGY_CREDENTIALS }}' > ~/.gemini/antigravity-cli/antigravity-oauth-token
          # تأمين الملف بصلاحيات القراءة فقط
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token

      - name: 🎬 إطلاق المخرج الهجين (Antigravity + AI Studio)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: |
          python pipeline.py

      - name: 💾 حفظ نسخة احتياطية للتحميل المباشر (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Master-Documentary-Vault
          path: output_build/*.mp4
          retention-days: 3
