name: 🎬 V58 Documentary Engine (Master Production)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الوثائقي (مثال: لغز القاتل زودياك)'
        required: true
        default: 'لغز القاتل زودياك'

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      VIDEO_TOPIC: ${{ inputs.topic }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # لدعم تدوير المفاتيح المتعددة
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # كاحتياطي في حال استخدمت مفتاحاً واحداً
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # المفتاح الذي أضفته مؤخراً
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
      OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: '1wn4z3A-t8Dnnq1kkiJopvUsCBQpkWxQW'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: 📥 Checkout repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🧹 Maximize Runner Disk Space (Reclaim ~30GB)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎞️ Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: 🔎 Verify Media Assets (Intro & Logo)
        run: |
          git lfs pull || true
          echo "=== فحص حجم وجودة الملفات المرفوعة ==="
          ls -lh intro.mp4 logo.png || true
          if [ -f intro.mp4 ]; then
            echo "--- فحص بنية ومدة فيديو الإنترو عبر ffprobe ---"
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 intro.mp4 || echo "⚠️ تنبيه: الملف لا يزال تالفاً أو فارغاً"
          else
            echo "⚠️ تنبيه: لم يتم العثور على ملف intro.mp4 في المجلد الرئيسي"
          fi

      - name: 🔤 Install Arabic subtitle fonts and ASS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fontconfig
          fc-match 'Noto Sans Arabic' || true
          fc-cache -f -v >/dev/null 2>&1 || true

      - name: 📦 Install Python dependencies
        run: |
          pip install requests google-genai google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: ⚡ Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL --compressed https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 🔐 Configure Antigravity OAuth2
        env:
          OAUTH_JSON: ${{ secrets.AGY_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$OAUTH_JSON"
          mkdir -p ~/.gemini/antigravity-cli/
          printf "%s" "$OAUTH_JSON" > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token

      - name: 🕵️ Verify Antigravity CLI authentication
        run: |
          set -euo pipefail
          command -v agy
          agy --help >/dev/null 2>&1
          echo "✅ Antigravity CLI is ready and authenticated from AGY_CREDENTIALS."

      - name: 🚀 Run Master Pipeline
        run: python pipeline_V26.py

      - name: 🔍 Verify Final Documentary
        run: |
          set -euo pipefail
          test -s output_build/final_documentary.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output_build/final_documentary.mp4
          echo "✅ final_documentary.mp4 exists and is probeable."

      - name: 📤 Upload Final Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V58-Documentary-Master
          path: output_build/final_documentary.mp4
          if-no-files-found: warn
