name: Upload Video Directly to YouTube

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان الفيديو على يوتيوب (أقل من 95 حرف):'
        required: true
        default: 'تحقيق استقصائي: لغز القاتل زودياك وحل الشفرة بعد نصف قرن'
        type: string

jobs:
  upload-only:
    runs-on: ubuntu-latest
    steps:
      - name: استدعاء المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت مكتبات Google API
        run: pip install google-api-python-client google-auth requests

      - name: سحب الفيديو من درايف ونشره فوراً
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DOC_TITLE: ${{ inputs.title }}
        run: |
          python - << 'EOF'
          import os, io, sys
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload, MediaIoBaseDownload

          client_id = os.environ.get("GOOGLE_CLIENT_ID")
          client_secret = os.environ.get("GOOGLE_CLIENT_SECRET")
          yt_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")
          drive_token = os.environ.get("DRIVE_REFRESH_TOKEN")
          video_title = os.environ.get("DOC_TITLE", "تحقيق استقصائي جديد")[:95]

          # 1. الاتصال بـ Google Drive
          drive_creds = Credentials(None, refresh_token=drive_token, token_uri="https://oauth2.googleapis.com/token", client_id=client_id, client_secret=client_secret)
          drive_service = build("drive", "v3", credentials=drive_creds)

          print("🔍 جاري جلب أحدث فيديو من Google Drive...")
          query = "name contains 'Broadcast_Master' and mimeType='video/mp4' and trashed=false"
          results = drive_service.files().list(q=query, orderBy="createdTime desc", pageSize=1, fields="files(id, name)").execute()
          files = results.get("files", [])

          if not files:
              print("❌ لم يتم العثور على الفيديو داخل درايف!")
              sys.exit(1)

          file_id = files[0]["id"]
          local_filename = "downloaded_video.mp4"
          print(f"📥 جاري تنزيل الملف السحابي: {files[0]['name']}...")

          request = drive_service.files().get_media(fileId=file_id)
          with open(local_filename, "wb") as f:
              downloader = MediaIoBaseDownload(f, request)
              done = False
              while not done:
                  status, done = downloader.next_chunk()
                  print(f"تقدم التنزيل: {int(status.progress() * 100)}%")

          # 2. النشر المباشر على YouTube
          print(f"🚀 جاري النشر على YouTube بعنوان: {video_title}...")
          yt_creds = Credentials(None, refresh_token=yt_token, token_uri="https://oauth2.googleapis.com/token", client_id=client_id, client_secret=client_secret)
          yt_service = build("youtube", "v3", credentials=yt_creds)

          body = {
              "snippet": {
                  "title": video_title,
                  "description": "تحقيق استقصائي شامل يفتح الملفات والأدلة الأرشيفية الموثقة.\n\n#وثائقي #تحقيقات #غموض",
                  "tags": ["وثائقي", "تحقيقات", "أدلة جنائية"],
                  "categoryId": "27"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(local_filename, mimetype="video/mp4", resumable=True, chunksize=15 * 1024 * 1024)
          upload_req = yt_service.videos().insert(part="snippet,status", body=body, media_body=media)

          res = None
          while res is None:
              status, res = upload_req.next_chunk()
              if status:
                  print(f"تقدم الرفع: {int(status.progress() * 100)}%")

          print(f"🎉 تم النشر بنجاح! الرابط: https://youtu.be/{res.get('id')}")
          EOF
