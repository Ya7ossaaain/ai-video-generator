name: Lemmino 2-Minute Benchmark Engine (AGY + 3D)

on:
  workflow_dispatch: # تشغيل يدوي بنقرة زر

jobs:
  render-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 📥 تفقد المستودع (Checkout Code)
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة بايثون و Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🟢 إعداد Node.js لتشغيل AGY
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔑 إعداد وتسجيل اعتماد AGY
        env:
          AGY_CREDS: ${{ secrets.AGY_CREDENTIALS }}
        run: |
          # تثبيت أداة agy عالمياً إذا كانت متوفرة عبر npm
          npm install -g agy || true
          
          # تهيئة مجلد الإعدادات وتسجيل الاعتماد
          mkdir -p ~/.config/agy ~/.agy
          echo "$AGY_CREDS" > ~/.config/agy/credentials.json
          echo "$AGY_CREDS" > ~/.config/agy/config.json
          echo "$AGY_CREDS" > ~/.agy/credentials.json
          export AGY_CREDENTIALS="$AGY_CREDS"
          echo "✅ تم تجهيز اعتماد AGY بنجاح."

      - name: 📦 تثبيت Blender و FFmpeg والخطوط العربية
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          sudo snap install blender --classic

      - name: 🐍 تثبيت مكتبات بايثون
        run: |
          pip install --upgrade pip
          pip install requests google-genai google-api-python-client google-auth

      - name: 🎬 تشغيل محرك الرندر والاختبار
        env:
          AGY_CREDENTIALS: ${{ secrets.AGY_CREDENTIALS }}
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
          OPENTOPOGRAPHY_API_KEY: ${{ secrets.OPENTOPOGRAPHY_API_KEY }}
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python lemmino_2min_engine.py

      - name: 📤 رفع الفيديو الناتج كملف للتحميل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Lemmino-2Min-Benchmark-Video
          path: output_benchmark/lemmino_2min_benchmark.mp4
          retention-days: 7
