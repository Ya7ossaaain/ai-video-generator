name: Documentary Production & Render Engine

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'اكتب عنوان أو موضوع الوثائقي هنا:'
        required: true
        default: 'لغز القاتل زودياك: وثائق التحقيق الجنائية وحل الشفرة بعد نصف قرن'
        type: string

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: تثبيت FFmpeg والخطوط الأساسية
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: تثبيت مكتبات بايثون المطلوبة
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth requests pillow arabic-reshaper python-bidi

      - name: تشغيل خط الإنتاج الوثائقي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: python pipeline.py

      - name: أرشفة الفيديو المكتمل في حال تعثر الرفع
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completed-documentary
          path: output_build/*.mp4
          retention-days: 3
