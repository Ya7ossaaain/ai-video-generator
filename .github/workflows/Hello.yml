name: render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools & Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg fonts-noto-core fonts-noto-extra
          sudo snap install blender --classic

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai google-api-python-client google-auth

      - name: Setup & Authenticate Antigravity (agy CLI)
        env:
          AGY_CREDS: ${{ secrets.AGY_CREDENTIALS }}
        run: |
          # 1. تثبيت أداة Antigravity CLI الرسمية وإضافتها للـ PATH
          curl -fsSL https://antigravity.google/cli/install.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"

          # 2. تسجيل المفتاح في المسار المعتمد لأداة agy في السيرفرات السحابية
          mkdir -p ~/.gemini/antigravity-cli ~/.config/antigravity ~/.config/agy ~/.agy
          echo "$AGY_CREDS" > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token

          # نسخ احتياطية للمسارات الأخرى
          echo "$AGY_CREDS" > ~/.gemini/antigravity-cli/credentials.json
          echo "$AGY_CREDS" > ~/.config/antigravity/credentials.json
          echo "$AGY_CREDS" > ~/.config/agy/credentials.json

          # تصدير متغيرات الجلسة السحابية
          echo "SSH_CONNECTION=127.0.0.1 0 127.0.0.1 22" >> $GITHUB_ENV
          echo "AGY_OAUTH_TOKEN=$AGY_CREDS" >> $GITHUB_ENV
          echo "AGY_CREDENTIALS=$AGY_CREDS" >> $GITHUB_ENV
          echo "✅ تم تفعيل جلسة AGY السحابية بنجاح."

      - name: Execute Full Autonomous Pipeline
        env:
          DISPLAY: ":99"
          PYTHONUNBUFFERED: "1"
          SSH_CONNECTION: "127.0.0.1 0 127.0.0.1 22"
          AGY_OAUTH_TOKEN: ${{ secrets.AGY_CREDENTIALS }}
          AGY_CREDENTIALS: ${{ secrets.AGY_CREDENTIALS }}
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
          OPENTOPOGRAPHY_API_KEY: ${{ secrets.OPENTOPOGRAPHY_API_KEY }}
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          python -u lemmino_2min_engine.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lemmino-2Min-Benchmark-Video
          path: output_benchmark/lemmino_2min_benchmark.mp4
          retention-days: 7
