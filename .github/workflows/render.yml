name: إنتاج الفيلم الوثائقي السحابي

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيلم الوثائقي'
        required: false
        default: 'حادثة ممر دياتلوف: اللغز الذي حيّر العالم'

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء المشروع
        uses: actions/checkout@v4

      - name: تثبيت بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت FFmpeg والخطوط العربية والمكتبات
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          pip install --upgrade pip
          pip install google-genai requests google-api-python-client google-auth-oauthlib google-auth-httplib2 edge-tts arabic-reshaper python-bidi

      - name: تشغيل التوليد والمونتاج السحابي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        run: python -u pipeline.py

      - name: حفظ وتجهيز الفيديو للتحميل المباشر
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video
          path: final_documentary.mp4
