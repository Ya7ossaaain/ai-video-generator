name: V24.2 — 7 Scene Pilot (PRO MOTION EDITION)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الاختبار الوثائقي'
        required: true
        default: 'لغز اختفاء غامض'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VIDEO_TOPIC: ${{ inputs.topic }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      GENERATE_THUMBNAIL: '0'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Arabic subtitle fonts and ASS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fontconfig
          fc-match 'Noto Sans Arabic' || true
          fc-cache -f -v >/dev/null 2>&1 || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL --compressed https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Antigravity OAuth2
        env:
          OAUTH_JSON: ${{ secrets.AGY_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$OAUTH_JSON"
          mkdir -p ~/.gemini/antigravity-cli/
          printf "%s" "$OAUTH_JSON" > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token

      - name: Verify Antigravity CLI authentication
        run: |
          set -euo pipefail
          command -v agy
          agy --help >/dev/null 2>&1
          echo "✅ Antigravity CLI is ready and authenticated from AGY_CREDENTIALS."

      - name: Run PRO MOTION pilot
        run: python pipeline_V24_2_7SCENE_TEST.py

      - name: Verify FINAL master strictly
        run: |
          set -euo pipefail
          test -s output_build/final_documentary.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output_build/final_documentary.mp4
          echo "✅ final_documentary.mp4 exists and is probeable."

      - name: Package test outputs
        if: always()
        run: |
          mkdir -p artifact
          cp -r output_build artifact/ || true
          cp production_logs.txt artifact/ || true
          cp director_memory.md artifact/ || true

      - name: Upload pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V24.2-7scene-PRO-MOTION
          path: artifact/
          if-no-files-found: warn
