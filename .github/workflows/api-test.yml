name: فحص مفاتيح الـ APIs 🔍

on:
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل الفحص يدوياً بضغطة زر

jobs:
  test_apis:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
      OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
      APIFLASH_ACCESS_KEY: ${{ secrets.APIFLASH_ACCESS_KEY }}

    steps:
      - name: 🐍 تجهيز بيئة بايثون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 تثبيت المكتبات
        run: pip install requests

      - name: 🚀 تشغيل الفحص
        run: |
          cat << 'EOF' > api_tester.py
          import os
          import requests

          def test_api(name, url, headers=None):
              try:
                  res = requests.get(url, headers=headers or {}, timeout=10)
                  if res.status_code in [200, 201, 202]:
                      print(f"✅ {name: <15} : متصل وتعمل بنجاح")
                  else:
                      print(f"❌ {name: <15} : فشل (كود الخطأ: {res.status_code})")
              except Exception as e:
                  print(f"❌ {name: <15} : فشل الاتصال بالسيرفر")

          print("\n" + "="*40)
          print("🔍 جاري فحص مفاتيح الـ APIs من خزنة GitHub...")
          print("="*40 + "\n")

          k = os.environ.get("GEMINI_API_KEY")
          if k: test_api("Gemini", f"https://generativelanguage.googleapis.com/v1beta/models?key={k}")
          else: print(f"⚠️  {'Gemini': <15} : تم التخطي (المفتاح غير مسجل)")

          k = os.environ.get("PEXELS_API_KEY")
          if k: test_api("Pexels", "https://api.pexels.com/v1/search?query=test&per_page=1", {"Authorization": k})
          else: print(f"⚠️  {'Pexels': <15} : تم التخطي")

          k = os.environ.get("PIXABAY_API_KEY")
          if k: test_api("Pixabay", f"https://pixabay.com/api/?key={k}&q=test")
          else: print(f"⚠️  {'Pixabay': <15} : تم التخطي")

          k = os.environ.get("MAPBOX_API_KEY")
          if k: test_api("Mapbox", f"https://api.mapbox.com/styles/v1/mapbox/dark-v10/static/0,0,1/100x100?access_token={k}")
          else: print(f"⚠️  {'Mapbox': <15} : تم التخطي")

          k = os.environ.get("GROQ_API_KEY")
          if k: test_api("Groq", "https://api.groq.com/openai/v1/models", {"Authorization": f"Bearer {k}"})
          else: print(f"⚠️  {'Groq': <15} : تم التخطي")

          k = os.environ.get("FREESOUND_API_KEY")
          if k: test_api("Freesound", f"https://freesound.org/apiv2/search/text/?query=test&token={k}")
          else: print(f"⚠️  {'Freesound': <15} : تم التخطي")

          k = os.environ.get("NYT_API_KEY")
          if k: test_api("NYT", f"https://api.nytimes.com/svc/search/v2/articlesearch.json?q=test&api-key={k}")
          else: print(f"⚠️  {'NYT': <15} : تم التخطي")

          k = os.environ.get("OPENCAGE_API_KEY")
          if k: test_api("OpenCage", f"https://api.opencagedata.com/geocode/v1/json?q=Sanaa&key={k}")
          else: print(f"⚠️  {'OpenCage': <15} : تم التخطي")

          k = os.environ.get("NEWS_API_KEY")
          if k: test_api("NewsAPI", f"https://newsapi.org/v2/top-headlines?country=us&apiKey={k}")
          else: print(f"⚠️  {'NewsAPI': <15} : تم التخطي")

          k = os.environ.get("UNSPLASH_API_KEY")
          if k: test_api("Unsplash", f"https://api.unsplash.com/search/photos?query=test&client_id={k}")
          else: print(f"⚠️  {'Unsplash': <15} : تم التخطي")

          k = os.environ.get("APIFLASH_ACCESS_KEY")
          if k: test_api("ApiFlash", f"https://api.apiflash.com/v1/urltoimage?access_key={k}&url=http://example.com")
          else: print(f"⚠️  {'ApiFlash': <15} : تم التخطي")

          print("\n" + "="*40)
          EOF
          python api_tester.py
