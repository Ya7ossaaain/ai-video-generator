name: V24.2 — 7 Scene Pilot Test + Drive

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الاختبار الوثائقي'
        required: true
        default: 'لغز اختفاء غامض'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      VIDEO_TOPIC: ${{ inputs.topic }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      GENERATE_THUMBNAIL: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Clean production workspace
        run: |
          rm -rf output_build
          mkdir -p output_build/cache
          rm -f production_logs.txt director_memory.md

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-core fonts-noto-extra fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # نفس طريقة مشروعك العامل: CLI على الـrunner المؤقت، ثم OAuth من AGY_CREDENTIALS.
      # هذا لا يلمس agy الموجود على هاتفك أو Ubuntu الخاص بك.
      - name: Install Antigravity CLI
        run: |
          curl -fsSL --compressed https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Antigravity OAuth2
        env:
          OAUTH_JSON: ${{ secrets.AGY_CREDENTIALS }}
        run: |
          test -n "$OAUTH_JSON"
          mkdir -p ~/.gemini/antigravity-cli/
          printf "%s" "$OAUTH_JSON" > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token

      - name: Verify Antigravity CLI authentication
        run: |
          command -v agy
          agy --help >/dev/null 2>&1
          echo "Antigravity CLI is ready and authenticated from AGY_CREDENTIALS."

      - name: Run 7-scene pilot
        env:
          AGY_CREDENTIALS: ${{ secrets.AGY_CREDENTIALS }}
        run: python -u pipeline_V24_2_7SCENE_TEST.py

      - name: Verify final output
        if: success()
        run: |
          test -s output_build/final_documentary.mp4 || test -n "$(find output_build -type f -name '*.mp4' -size +100k -print -quit)"
          find output_build -maxdepth 3 -type f -printf '%p %k KB\n' | sort | tail -100

      - name: Package test outputs
        if: always()
        run: |
          mkdir -p artifact
          cp -r output_build artifact/ 2>/dev/null || true
          cp production_logs.txt artifact/ 2>/dev/null || true
          cp director_memory.md artifact/ 2>/dev/null || true

      - name: Upload pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V24.2-7scene-pilot-${{ github.run_id }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 3
