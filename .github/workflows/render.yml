name: Generate Long Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'اكتب موضوع الفيديو هنا (بالإنجليزية أو العربية)'
        required: true
        default: 'Ancient Egypt Mysteries'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: استدعاء المشروع
        uses: actions/checkout@v4

      - name: تثبيت بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت أدوات المونتاج والمكتبات
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts google-generativeai

      - name: تشغيل التوليد والمونتاج السحابي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        run: python pipeline.py

      - name: حفظ وتجهيز الفيديو للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: Full-Documentary-Video
          path: final_long_video.mp4
          retention-days: 7
