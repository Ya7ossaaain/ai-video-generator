name: Upload Video Artifact to Google Drive

on:
  workflow_dispatch:

jobs:
  upload-to-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub Artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Ya7ossaaain/ai-video-generator
          run-id: 36938120664
          artifact-ids: 11200560936
          path: ./artifact

      - name: Show downloaded files
        run: |
          echo "=== Artifact contents ==="
          find ./artifact -type f -printf '%p\n'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive dependencies
        run: |
          pip install --quiet google-api-python-client google-auth google-auth-oauthlib

      - name: Upload files to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          python <<'PY'
          import os
          import glob
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          CLIENT_ID = os.environ["GOOGLE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["GOOGLE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["DRIVE_REFRESH_TOKEN"]

          creds = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )

          drive = build("drive", "v3", credentials=creds)

          files = []
          for pattern in ["./artifact/**/*.mp4", "./artifact/**/*.mov", "./artifact/**/*.mkv"]:
              files.extend(glob.glob(pattern, recursive=True))

          if not files:
              print("ERROR: No video file found in artifact.")
              raise SystemExit(1)

          print(f"Found {len(files)} video file(s).")

          for filepath in files:
              filename = os.path.basename(filepath)

              print(f"Uploading: {filename}")

              metadata = {
                  "name": filename
              }

              media = MediaFileUpload(
                  filepath,
                  resumable=True
              )

              uploaded = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink"
              ).execute()

              file_id = uploaded["id"]

              # Make the uploaded file accessible through its Drive link.
              drive.permissions().create(
                  fileId=file_id,
                  body={
                      "type": "anyone",
                      "role": "reader"
                  }
              ).execute()

              link = f"https://drive.google.com/file/d/{file_id}/view"

              print("")
              print("========================================")
              print("UPLOAD COMPLETE")
              print(f"File: {uploaded['name']}")
              print(f"Drive ID: {file_id}")
              print(f"Drive URL: {link}")
              print("========================================")
              print("")

          print("All videos uploaded successfully.")
          PY

      - name: Cleanup
        if: always()
        run: |
          rm -rf ./artifact
          echo "Temporary artifact files removed from GitHub runner."
