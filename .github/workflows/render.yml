name: إنتاج الفيلم الوثائقي السحابي

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيلم الوثائقي'
        required: false
        default: 'حادثة ممر دياتلوف: اللغز الذي حيّر العالم'

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء المشروع
        uses: actions/checkout@v4

      - name: تثبيت بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت FFmpeg والمكتبات
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install edge-tts google-generativeai requests

      - name: تشغيل التوليد والمونتاج السحابي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_UPLOAD_URL: ${{ secrets.DRIVE_UPLOAD_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        run: python -u pipeline.py

      - name: حفظ وتجهيز الفيديو للتحميل المباشر
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video
          path: final_documentary.mp4
