name: Enterprise Documentary Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'اكتب عنوان أو موضوع الوثائقي هنا (مثال: لغز اختفاء طائرة دي بي كوبر):'
        required: true
        default: 'تحقيق استقصائي: لغز القاتل زودياك وحل الشفرة بعد نصف قرن'
        type: string

jobs:
  production-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # السماح بالتشغيل حتى 6 ساعات لحماية الرندرة المعقدة من الانقطاع

    steps:
      - name: استدعاء مستودع المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # تم حذف سطر الكاش نهائياً من هنا لتفادي خطأ requirements.txt

      - name: تثبيت محرك FFmpeg والخطوط التلفزيونية
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core fontconfig
          sudo fc-cache -fv

      - name: تثبيت حزم الذكاء الاصطناعي ومكتبات السحابة
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth requests

      - name: تشغيل محرك الإنتاج والمونتاج (Master Director)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: python pipeline.py

      - name: أرشفة الفيلم المكتمل وملفات الاسترداد (Artifacts Vault)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-master-vault
          path: |
            output_build/*.mp4
            output_build/*.json
          retention-days: 5
