name: V26 — Elite VFX Engine (OpenCV + ImageMagick)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الاختبار الوثائقي'
        required: true
        default: 'لغز اختفاء غامض'

jobs:
  studio_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VIDEO_TOPIC: ${{ inputs.topic }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg, Fonts & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig imagemagick
          fc-cache -f -v >/dev/null 2>&1 || true

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL --compressed https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Antigravity OAuth2
        env:
          OAUTH_JSON: ${{ secrets.AGY_CREDENTIALS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gemini/antigravity-cli/
          printf "%s" "$OAUTH_JSON" > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token

      - name: Run Elite VFX Engine
        run: python pipeline_V24_2_7SCENE_TEST.py

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V26-Elite-Documentary
          path: output_build/final_documentary.mp4
