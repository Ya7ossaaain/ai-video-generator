name: V24.2 — 7 Scene Pilot Test

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الاختبار الوثائقي'
        required: true
        default: 'لغز اختفاء غامض'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VIDEO_TOPIC: ${{ inputs.topic }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      GENERATE_THUMBNAIL: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify existing Antigravity CLI
        shell: bash
        run: |
          set -euo pipefail
          echo "Using the existing agy supplied by the GitHub/Antigravity environment."
          command -v agy
          agy --help >/dev/null 2>&1 || true
          echo "agy is present; no installation, update, npm install, PATH modification, or reconfiguration will be performed."

      - name: Run 7-scene pilot
        run: python pipeline_V24_2_7SCENE_TEST.py

      - name: Package test outputs
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp -r output_build artifact/ 2>/dev/null || true
          cp production_logs.txt artifact/ 2>/dev/null || true
          cp director_memory.md artifact/ 2>/dev/null || true

      - name: Upload pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V24.2-7scene-pilot
          path: artifact/
          if-no-files-found: warn
