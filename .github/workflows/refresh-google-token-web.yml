name: 🔐 Google OAuth → GitHub Refresh Token

on:
  workflow_dispatch:
    inputs:
      action:
        description: "اختر العملية"
        required: true
        type: choice
        options:
          - get_authorization_url
          - exchange_code

      authorization_code:
        description: "Authorization Code — مطلوب فقط مع exchange_code"
        required: false
        type: string

jobs:
  google-oauth:
    runs-on: ubuntu-latest

    env:
      # هذا هو Client ID الذي أثبتنا أنه يعمل يدويًا
      GOOGLE_CLIENT_ID: "677775275172-4hqpaej9bbenmdk5kaa9i9gbok5ul867.apps.googleusercontent.com"

      GOOGLE_REDIRECT_URI: "https://developers.google.com/oauthplayground"

    steps:

      # ============================================================
      # 1. فحص الإعدادات
      # ============================================================

      - name: 🔧 Check configuration
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "❌ GOOGLE_CLIENT_SECRET غير موجود."
            exit 1
          fi

          if [ -z "$GH_PAT" ]; then
            echo "❌ GH_PAT غير موجود."
            exit 1
          fi

          echo "======================================"
          echo "✅ GOOGLE_CLIENT_ID"
          echo "   677775275172-4hqpaej9bbenmdk5kaa9i9gbok5ul867.apps.googleusercontent.com"
          echo ""
          echo "✅ GOOGLE_CLIENT_SECRET موجود"
          echo "✅ GH_PAT موجود"
          echo "======================================"

      # ============================================================
      # 2. إنشاء رابط OAuth
      # ============================================================

      - name: 🔗 Generate Google OAuth URL
        if: inputs.action == 'get_authorization_url'
        run: |
          python3 - <<'PY'
          import urllib.parse
          import secrets

          client_id = "677775275172-4hqpaej9bbenmdk5kaa9i9gbok5ul867.apps.googleusercontent.com"

          redirect_uri = "https://developers.google.com/oauthplayground"

          scopes = [
              "https://www.googleapis.com/auth/youtube.upload",
              "https://www.googleapis.com/auth/drive",
          ]

          state = secrets.token_urlsafe(32)

          params = {
              "client_id": client_id,
              "redirect_uri": redirect_uri,
              "response_type": "code",
              "scope": " ".join(scopes),
              "access_type": "offline",
              "prompt": "consent",
          }

          url = (
              "https://accounts.google.com/o/oauth2/v2/auth?"
              + urllib.parse.urlencode(params)
          )

          print("")
          print("==============================================")
          print("🔗 GOOGLE OAUTH URL")
          print("==============================================")
          print(url)
          print("==============================================")
          print("")
          print("1. افتح الرابط.")
          print("2. سجّل الدخول إلى Google.")
          print("3. وافق على الصلاحيات.")
          print("4. سيتم تحويلك إلى OAuth Playground.")
          print("5. انسخ قيمة code من الرابط.")
          print("6. شغّل هذا Workflow مرة ثانية واختر:")
          print("   exchange_code")
          print("==============================================")
          PY

      # ============================================================
      # 3. التأكد من وجود Authorization Code
      # ============================================================

      - name: 🧪 Validate Authorization Code
        if: inputs.action == 'exchange_code'
        env:
          AUTH_CODE: ${{ inputs.authorization_code }}
        run: |
          set -e

          if [ -z "$AUTH_CODE" ]; then
            echo "❌ لم يتم إدخال Authorization Code."
            exit 1
          fi

          echo "✅ Authorization Code موجود."
          echo "🔒 لن تتم طباعة قيمته."

      # ============================================================
      # 4. Exchange Code → Refresh Token
      # ============================================================

      - name: 🔄 Exchange Authorization Code
        if: inputs.action == 'exchange_code'
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_CODE: ${{ inputs.authorization_code }}
        run: |

          set -e

          echo "======================================"
          echo "🔄 الاتصال بخادم Google OAuth..."
          echo "======================================"

          RESPONSE=$(curl -sS -X POST \
            "https://oauth2.googleapis.com/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "code=${AUTH_CODE}" \
            --data-urlencode "client_id=677775275172-4hqpaej9bbenmdk5kaa9i9gbok5ul867.apps.googleusercontent.com" \
            --data-urlencode "client_secret=${GOOGLE_CLIENT_SECRET}" \
            --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "redirect_uri=https://developers.google.com/oauthplayground")

          echo "$RESPONSE" > /tmp/google_response.json

          python3 - <<'PY'
          import json

          with open("/tmp/google_response.json", "r") as f:
              data = json.load(f)

          if "error" in data:
              print("")
              print("❌ Google OAuth فشل")
              print("--------------------------------------")
              print("error:", data.get("error"))
              print("description:", data.get("error_description", ""))
              print("--------------------------------------")
              raise SystemExit(1)

          refresh_token = data.get("refresh_token")

          if not refresh_token:
              print("❌ Google لم تُرجع Refresh Token.")
              print("")
              print("الاستجابة احتوت على:")
              print(list(data.keys()))
              raise SystemExit(1)

          with open("/tmp/google_refresh_token", "w") as f:
              f.write(refresh_token)

          print("")
          print("======================================")
          print("✅ تم الحصول على Refresh Token")
          print("======================================")
          print("🔒 لن تتم طباعة قيمته.")
          PY

      # ============================================================
      # 5. الحصول على GitHub Public Key
      # ============================================================

      - name: 🔐 Get GitHub repository public key
        if: inputs.action == 'exchange_code'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |

          set -e

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" \
            > /tmp/github_public_key.json

          python3 - <<'PY'
          import json

          with open("/tmp/github_public_key.json") as f:
              data = json.load(f)

          if "key" not in data or "key_id" not in data:
              print(json.dumps(data, indent=2))
              raise SystemExit("❌ فشل الحصول على GitHub public key.")

          print("✅ GitHub public key obtained.")
          PY

      # ============================================================
      # 6. تشفير Refresh Token
      # ============================================================

      - name: 🔒 Encrypt Refresh Token
        if: inputs.action == 'exchange_code'
        run: |

          set -e

          python3 -m pip install --quiet pynacl

          python3 - <<'PY'
          import base64
          import json
          from nacl import encoding, public

          with open("/tmp/github_public_key.json") as f:
              github_key = json.load(f)

          with open("/tmp/google_refresh_token") as f:
              refresh_token = f.read().strip()

          public_key = public.PublicKey(
              github_key["key"].encode(),
              encoding.Base64Encoder()
          )

          sealed_box = public.SealedBox(public_key)

          encrypted = sealed_box.encrypt(
              refresh_token.encode()
          )

          encrypted_b64 = base64.b64encode(
              encrypted
          ).decode()

          with open("/tmp/encrypted_refresh_token", "w") as f:
              f.write(encrypted_b64)

          print("✅ Refresh Token encrypted.")
          PY

      # ============================================================
      # 7. تحديث GitHub Secret
      # ============================================================

      - name: 📤 Update GOOGLE_REFRESH_TOKEN
        if: inputs.action == 'exchange_code'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |

          set -e

          KEY_ID=$(python3 - <<'PY'
          import json

          with open("/tmp/github_public_key.json") as f:
              print(json.load(f)["key_id"])
          PY
          )

          ENCRYPTED_VALUE=$(cat /tmp/encrypted_refresh_token)

          python3 - "$KEY_ID" "$ENCRYPTED_VALUE" > /tmp/secret_payload.json <<'PY'
          import json
          import sys

          print(json.dumps({
              "encrypted_value": sys.argv[2],
              "key_id": sys.argv[1]
          }))
          PY

          HTTP_CODE=$(curl -sS \
            -o /tmp/github_response.json \
            -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/GOOGLE_REFRESH_TOKEN" \
            --data-binary @/tmp/secret_payload.json)

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "204" ]; then
              echo "❌ فشل تحديث GitHub Secret."
              echo "HTTP: ${HTTP_CODE}"
              cat /tmp/github_response.json
              exit 1
          fi

          echo ""
          echo "======================================"
          echo "🎉 GOOGLE_REFRESH_TOKEN تم تحديثه"
          echo "======================================"
          echo "✅ YouTube OAuth"
          echo "✅ Google Drive OAuth"
          echo "🔐 Refresh Token مشفر قبل إرساله إلى GitHub."
          echo "======================================"

      # ============================================================
      # 8. تنظيف
      # ============================================================

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f \
            /tmp/google_response.json \
            /tmp/google_refresh_token \
            /tmp/github_public_key.json \
            /tmp/encrypted_refresh_token \
            /tmp/secret_payload.json \
            /tmp/github_response.json

          echo "🧹 Cleanup complete."
