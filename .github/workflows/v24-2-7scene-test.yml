name: 🎬 V25 Documentary Engine

on:
  workflow_dispatch:
    inputs:
      video_topic:
        description: 'موضوع الفيلم الوثائقي (مثال: لغز اختفاء روزيل)'
        required: true
        default: 'لغز اختفاء غامض'

jobs:
  build-documentary:
    name: Generate & Render Video
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎞️ Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai
          
          # ملاحظة: إذا كانت أداة agy تحتاج لتثبيت عبر npm أو pip، ضع أمر تثبيتها هنا
          # npm install -g [اسم_الحزمة]

      - name: 🚀 Run Documentary Pipeline
        env:
          VIDEO_TOPIC: ${{ github.event.inputs.video_topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: |
          # تأكد أن اسم ملف البايثون في مستودعك يطابق هذا الاسم
          python pipeline_V25.py

      - name: 📤 Upload Final Documentary
        uses: actions/upload-artifact@v4
        with:
          name: Final-Documentary-${{ github.run_id }}
          path: output_build/final_documentary.mp4
          retention-days: 5
