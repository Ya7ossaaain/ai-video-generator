name: Upload Files to Google Drive

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Upload video to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ["DRIVE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )

          drive = build("drive", "v3", credentials=creds)

          # ابحث عن ملفات الفيديو داخل المستودع
          videos = []
          for ext in ("*.mp4", "*.mov", "*.mkv", "*.webm"):
              videos.extend(Path(".").rglob(ext))

          if not videos:
              raise SystemExit("❌ لم يتم العثور على ملف فيديو.")

          for file in videos:
              print(f"⬆️ Uploading: {file}")

              media = MediaFileUpload(
                  str(file),
                  resumable=True
              )

              result = drive.files().create(
                  body={"name": file.name},
                  media_body=media,
                  fields="id,name"
              ).execute()

              print(f"✅ Uploaded: {result['name']}")
              print(
                  f"🔗 https://drive.google.com/file/"
                  f"{result['id']}/view"
              )

          print("🎉 تم رفع جميع ملفات الفيديو إلى Google Drive.")
          PY
